  <line x1="579" y1="320" x2="579" y2="370" stroke="#1F3A5F" stroke-width="1"/>
  <line x1="560" y1="345" x2="598" y2="345" stroke="#1F3A5F" stroke-width="1"/>

  <rect x="612" y="320" width="38" height="50" fill="#b3d9f7" stroke="#1F3A5F" stroke-width="1.5"/>
  <line x1="631" y1="320" x2="631" y2="370" stroke="#1F3A5F" stroke-width="1"/>
  <line x1="612" y1="345" x2="650" y2="345" stroke="#1F3A5F" stroke-width="1"/>

  <rect x="664" y="320" width="38" height="50" fill="#b3d9f7" stroke="#1F3A5F" stroke-width="1.5"/>
  <line x1="683" y1="320" x2="683" y2="370" stroke="#1F3A5F" stroke-width="1"/>
