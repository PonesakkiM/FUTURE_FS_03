  <line x1="631" y1="175" x2="631" y2="219" stroke="#1F3A5F" stroke-width="1"/>
  <line x1="612" y1="197" x2="650" y2="197" stroke="#1F3A5F" stroke-width="1"/>

  <rect x="664" y="175" width="38" height="44" fill="#b3d9f7" stroke="#1F3A5F" stroke-width="1.5"/>
  <line x1="683" y1="175" x2="683" y2="219" stroke="#1F3A5F" stroke-width="1"/>
  <line x1="664" y1="197" x2="702" y2="197" stroke="#1F3A5F" stroke-width="1"/>

