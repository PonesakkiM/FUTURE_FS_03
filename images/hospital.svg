  <rect x="463" y="355" width="44" height="42" fill="#b3d9f7"/>
  <!-- Door handles -->
  <rect x="432" y="374" width="8" height="4" fill="#1F3A5F"/>
  <rect x="460" y="374" width="8" height="4" fill="#1F3A5F"/>
  <!-- Steps -->
