  <rect x="519" y="352" width="6" height="48" fill="#1F3A5F"/>
  <!-- Main door -->
  <rect x="390" y="352" width="50" height="48" fill="#1F3A5F"/>
  <rect x="460" y="352" width="50" height="48" fill="#1F3A5F"/>
  <!-- Door glass -->
