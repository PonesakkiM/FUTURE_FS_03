  <line x1="271" y1="320" x2="271" y2="370" stroke="#1F3A5F" stroke-width="1"/>
  <line x1="252" y1="345" x2="290" y2="345" stroke="#1F3A5F" stroke-width="1"/>

  <rect x="304" y="320" width="38" height="50" fill="#b3d9f7" stroke="#1F3A5F" stroke-width="1.5"/>
  <line x1="323" y1="320" x2="323" y2="370" stroke="#1F3A5F" stroke-width="1"/>
  <line x1="304" y1="345" x2="342" y2="345" stroke="#1F3A5F" stroke-width="1"/>

