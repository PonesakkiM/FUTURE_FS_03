  <line x1="200" y1="270" x2="238" y2="270" stroke="#1F3A5F" stroke-width="1"/>

  <rect x="252" y="245" width="38" height="50" fill="#b3d9f7" stroke="#1F3A5F" stroke-width="1.5"/>
  <line x1="271" y1="245" x2="271" y2="295" stroke="#1F3A5F" stroke-width="1"/>
  <line x1="252" y1="270" x2="290" y2="270" stroke="#1F3A5F" stroke-width="1"/>

  <rect x="304" y="245" width="38" height="50" fill="#b3d9f7" stroke="#1F3A5F" stroke-width="1.5"/>
  <line x1="323" y1="245" x2="323" y2="295" stroke="#1F3A5F" stroke-width="1"/>
  <line x1="304" y1="270" x2="342" y2="270" stroke="#1F3A5F" stroke-width="1"/>

  <rect x="560" y="245" width="38" height="50" fill="#b3d9f7" stroke="#1F3A5F" stroke-width="1.5"/>
  <line x1="579" y1="245" x2="579" y2="295" stroke="#1F3A5F" stroke-width="1"/>
  <line x1="560" y1="270" x2="598" y2="270" stroke="#1F3A5F" stroke-width="1"/>

  <rect x="612" y="245" width="38" height="50" fill="#b3d9f7" stroke="#1F3A5F" stroke-width="1.5"/>
  <line x1="631" y1="245" x2="631" y2="295" stroke="#1F3A5F" stroke-width="1"/>
  <line x1="612" y1="270" x2="650" y2="270" stroke="#1F3A5F" stroke-width="1"/>

  <rect x="664" y="245" width="38" height="50" fill="#b3d9f7" stroke="#1F3A5F" stroke-width="1.5"/>
  <line x1="683" y1="245" x2="683" y2="295" stroke="#1F3A5F" stroke-width="1"/>
  <line x1="664" y1="270" x2="702" y2="270" stroke="#1F3A5F" stroke-width="1"/>

