  <rect x="143" y="377" width="3" height="10" fill="#e53935"/>
  <!-- Wheels -->
  <rect x="108" y="395" width="10" height="5" fill="#333"/>
  <rect x="148" y="395" width="10" height="5" fill="#333"/>

  <!-- ── PHARMACY SIGN (right side) ── -->
  <rect x="730" y="350" width="70" height="50" fill="#e8f5e9" stroke="#1F3A5F" stroke-width="1.5"/>
  <rect x="730" y="350" width="70" height="16" fill="#2e7d32"/>
  <text x="765" y="362" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">PHARMACY</text>
  <!-- Green cross -->
  <rect x="752" y="372" width="26" height="8" fill="#2e7d32"/>
  <rect x="758" y="366" width="8" height="26" fill="#2e7d32"/>

  <!-- ── TREES ── -->
  <!-- Left tree -->
  <rect x="60" y="360" width="8" height="40" fill="#795548"/>
  <rect x="30" y="310" width="68" height="55" fill="#388e3c"/>
  <rect x="38" y="295" width="52" height="30" fill="#43a047"/>
  <rect x="46" y="282" width="36" height="22" fill="#4caf50"/>
  <!-- Right tree -->
  <rect x="832" y="360" width="8" height="40" fill="#795548"/>
  <rect x="802" y="310" width="68" height="55" fill="#388e3c"/>
  <rect x="810" y="295" width="52" height="30" fill="#43a047"/>
  <rect x="818" y="282" width="36" height="22" fill="#4caf50"/>

  <!-- ── FLAGPOLE ── -->
  <rect x="448" y="80" width="4" height="52" fill="#888888"/>
  <rect x="452" y="80" width="30" height="20" fill="#1F3A5F"/>
  <rect x="452" y="80" width="30" height="7" fill="#4A90E2"/>

  <!-- ── SIGNBOARD at entrance ── -->
