<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">

  <!-- Sky background -->
  <rect width="900" height="480" fill="#e8f4fd"/>

  <!-- Clouds -->
  <rect x="60" y="40" width="100" height="22" fill="#ffffff"/>
  <rect x="50" y="50" width="120" height="18" fill="#ffffff"/>
  <rect x="700" y="30" width="80" height="18" fill="#ffffff"/>
  <rect x="690" y="38" width="100" height="16" fill="#ffffff"/>
  <rect x="400" y="20" width="70" height="16" fill="#ffffff"/>
  <rect x="390" y="28" width="90" height="14" fill="#ffffff"/>

  <!-- Ground -->
