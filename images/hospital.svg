  <line x1="219" y1="175" x2="219" y2="219" stroke="#1F3A5F" stroke-width="1"/>
  <line x1="200" y1="197" x2="238" y2="197" stroke="#1F3A5F" stroke-width="1"/>

  <rect x="252" y="175" width="38" height="44" fill="#b3d9f7" stroke="#1F3A5F" stroke-width="1.5"/>
  <line x1="271" y1="175" x2="271" y2="219" stroke="#1F3A5F" stroke-width="1"/>
  <line x1="252" y1="197" x2="290" y2="197" stroke="#1F3A5F" stroke-width="1"/>

  <rect x="304" y="175" width="38" height="44" fill="#b3d9f7" stroke="#1F3A5F" stroke-width="1.5"/>
  <line x1="323" y1="175" x2="323" y2="219" stroke="#1F3A5F" stroke-width="1"/>
  <line x1="304" y1="197" x2="342" y2="197" stroke="#1F3A5F" stroke-width="1"/>

