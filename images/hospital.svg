  <!-- ── LARGE MEDICAL CROSS on building facade ── -->
  <rect x="408" y="168" width="84" height="28" fill="#4A90E2"/>
  <rect x="422" y="154" width="28" height="56" fill="#4A90E2"/>
  <!-- Cross border -->
