  <!-- ── AMBULANCE BAY (left side) ── -->
  <rect x="100" y="340" width="70" height="60" fill="#e3f2fd" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="135" y="358" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" fill="#1F3A5F" text-anchor="middle">AMBULANCE</text>
  <text x="135" y="370" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#1F3A5F" text-anchor="middle">BAY</text>
  <!-- Ambulance vehicle -->
  <rect x="105" y="375" width="60" height="22" fill="#ffffff" stroke="#1F3A5F" stroke-width="1.5"/>
  <rect x="105" y="375" width="20" height="22" fill="#e53935"/>
  <rect x="108" y="378" width="14" height="10" fill="#b3d9f7"/>
  <rect x="128" y="378" width="30" height="10" fill="#b3d9f7"/>
  <!-- Cross on ambulance -->
