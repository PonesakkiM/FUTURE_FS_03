<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="420" height="90">
  <!-- Background: transparent -->

  <!-- ── Medical Cross (shield-style, realistic) ── -->
  <!-- Outer shield border -->
  <rect x="6" y="6" width="72" height="78" fill="#1F3A5F"/>
  <!-- Inner shield fill -->
  <rect x="10" y="10" width="64" height="70" fill="#ffffff"/>
  <!-- Cross horizontal bar -->
  <rect x="18" y="34" width="48" height="16" fill="#1F3A5F"/>
  <!-- Cross vertical bar -->
  <rect x="34" y="18" width="16" height="48" fill="#1F3A5F"/>
  <!-- Small accent dots at cross ends -->
  <rect x="18" y="34" width="6" height="6" fill="#4A90E2"/>
  <rect x="60" y="44" width="6" height="6" fill="#4A90E2"/>
  <rect x="34" y="18" width="6" height="6" fill="#4A90E2"/>
  <rect x="44" y="60" width="6" height="6" fill="#4A90E2"/>
  <!-- Bottom shield point -->
  <polygon points="10,80 74,80 42,96" fill="#1F3A5F"/>
  <!-- Thin accent line at top of shield -->
  <rect x="10" y="10" width="64" height="4" fill="#4A90E2"/>

  <!-- ── Clinic Name ── -->
  <!-- "Sakthi" -->
  <text x="96" y="36" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="#1F3A5F" letter-spacing="1">SAKTHI</text>
  <!-- "MultiCare Clinic" -->
  <text x="96" y="60" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#4A90E2" letter-spacing="0.5">MultiCare Clinic</text>

  <!-- Separator line -->
  <rect x="96" y="66" width="310" height="2" fill="#1F3A5F"/>

  <!-- Tagline -->
  <text x="96" y="80" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#555555" letter-spacing="1.5">YOUR HEALTH, OUR PRIORITY</text>

  <!-- NABH badge (small, realistic touch) -->
  <rect x="370" y="10" width="42" height="18" fill="#1F3A5F"/>
  <text x="391" y="22" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">NABH</text>
  <rect x="370" y="28" width="42" height="14" fill="#4A90E2"/>
  <text x="391" y="38" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">Accredited</text>
</svg>
